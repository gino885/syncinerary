name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: syncinerary
          POSTGRES_PASSWORD: syncinerary
          POSTGRES_DB: syncinerary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncinerary -d syncinerary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev]'
      - name: Apply migrations
        run: .venv/bin/alembic upgrade head
      - name: Reject direct LLM SDK imports
        run: |
          if rg -n '^\s*(from|import)\s+(anthropic|langchain_anthropic|openai)(\.|\s|,)' syncinerary/agents syncinerary/tools; then
            echo "LLM SDK imports must stay behind syncinerary/harness/wrapper.py"
            exit 1
          fi
      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -q
      - name: Run Ruff
        run: .venv/bin/ruff check syncinerary tests
