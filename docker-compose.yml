services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: syncinerary
      POSTGRES_PASSWORD: syncinerary
      POSTGRES_DB: syncinerary
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncinerary"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"   # Phoenix UI
      - "4317:4317"   # OTLP gRPC ingress
    environment:
      PHOENIX_PORT: 6006

volumes:
  postgres_data:
